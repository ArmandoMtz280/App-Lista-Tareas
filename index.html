<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>To do list</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
      <div class="container">
          <div class="perfil">
              <div id="fecha">Miercoles 14 de Enero</div>
              <h1>Hola, Armando Mtz</h1>
              <span>Vamos a cumplir tus metas</span>
          </div>

          <div class="agregar-tarea">
              <input type="text" id="input" placeholder="agregar tarea">
              <i id="add" class="fas fa-plus-circle"></i>
          </div>

          <div class="seccion-tarea">
              <h3>Estas son tus tareas pendientes</h3>
              <ul id="lista">
                   <li>
                       <i class="far fa-circle co" data="realizado" id="0"></i>
                       <p class="text">Tarea 1</p>
                       <i class="fas fa-trash de" data="eliminado" id="0"></i>
                   </li>
              </ul>
          </div>
      </div>

      <script src="./app.js"></script>
</body>
</html>
